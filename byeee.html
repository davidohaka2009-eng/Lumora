<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let fruits = ["Apple" , "Banana" , "Orange"];
        document.write(fruits + "<br>");
        document.write("First fruit:" + fruits[0] + "<br>");
        document.write("Scond fruit:" + fruits[1] + "<br>");
        document.write("Third fruit:" + fruits[2] + "<br>"); 
        fruits.push("Mango", "pear", "watermelon");
        document.write(fruits + "<br>");
        fruits.pop();
        document.write(fruits + "<br>");
        document.write("Number of fruits:" + fruits.length + "<br>");
        document.write(fruits.join("-") + "<br>");
        fruits.shift();
        document.write(fruits + "<br>");
        fruits.unshift("Apple");
        document.write(fruits);


        let a = ["Red" , "Green"];
        let b = ["Blue" , "Yellow"];
        let color = a.concat(b);
        document.write(color)

    </script>
        
 </body>
</html>
